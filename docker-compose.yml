services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bicycle-reid:latest
    container_name: bicycle-reid-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: bicycle-reid:latest
    container_name: bicycle-reid-cli
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["--demo"]
    profiles:
      - cli

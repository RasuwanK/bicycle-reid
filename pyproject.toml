[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bicycle-reid"
version = "0.1.0"
description = "CCTV bicycle detection, tracking and cross-camera identification"
requires-python = ">=3.10"

dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "torch",
    "torchvision",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
bicycle-reid = "bicycle_reid.cli:main"
